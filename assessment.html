<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Readiness scorecard — ToUpper</title>
<meta name="description" content="Eighteen questions, one per practice area. Get a ranked list of the gaps blocking your enterprise deals.">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="narrow">
    <div id="intro" class="head" style="margin-bottom:36px">
      <span class="eyebrow">Scorecard</span>
      <h1 class="h1">Where are you actually blocked?</h1>
      <p class="body">Eighteen questions, one per practice area. Answer honestly — the useful output is the ranked list of gaps, not the number. Nothing leaves this browser.</p>
    </div>

    <div id="quiz">
      <div class="progress">
        <span class="eyebrow" id="stepLabel"></span>
        <span class="tiny muted" id="answered"></span>
      </div>
      <div class="track"><i id="trackFill" style="width:0"></i></div>
      <h2 class="h2" id="groupName" style="margin-bottom:4px"></h2>
      <p class="small muted" id="groupTag" style="margin-bottom:18px"></p>
      <div id="qs"></div>
      <div class="spread" style="margin-top:26px">
        <button class="btn btn-ghost btn-sm" id="back">Back</button>
        <button class="btn btn-accent" id="next">Continue</button>
      </div>
    </div>

    <div id="results" class="hide"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="data/domains.js"></script>
<script src="data/experts.js"></script>
<script src="assets/js/questions.js"></script>
<script src="assets/js/core.js"></script>
<script>
(function () {
  var Q = window.TOUPPER_QUESTIONS;
  var GROUPS = window.TOUPPER_GROUPS;
  var LABELS = ['Not yet', 'Partly', 'Solid'];
  var answers = {}, step = 0;

  var prev = T.loadScores();
  if (prev && prev.answers) answers = prev.answers;

  var el = {};
  ['quiz','results','qs','back','next','intro','stepLabel','answered','trackFill','groupName','groupTag']
    .forEach(function (id) { el[id] = document.getElementById(id); });

  function groupDomains(i) {
    return T.domains.filter(function (d) { return d.group === GROUPS[i].name; });
  }
  function countAnswered() { return Object.keys(answers).length; }

  function render() {
    var g = GROUPS[step], ds = groupDomains(step);
    el.stepLabel.textContent = 'Step ' + (step + 1) + ' of ' + GROUPS.length;
    el.answered.textContent = countAnswered() + ' of ' + T.domains.length + ' answered';
    el.trackFill.style.width = (countAnswered() / T.domains.length * 100) + '%';
    el.groupName.textContent = g.name;
    el.groupTag.textContent = g.tag;

    el.qs.innerHTML = ds.map(function (d) {
      var q = Q[d.slug];
      return '<div class="q" data-d="' + d.slug + '">' +
        '<div class="qt">' + T.esc(q.q) + '</div>' +
        '<div class="qs">' + T.esc(q.s) + '</div>' +
        '<div class="opts">' + q.a.map(function (a, i) {
          return '<button class="opt' + (answers[d.slug] === i ? ' on' : '') + '" data-v="' + i +
            '" title="' + T.esc(a) + '">' + LABELS[i] + '</button>';
        }).join('') + '</div></div>';
    }).join('');

    el.back.style.visibility = step === 0 ? 'hidden' : 'visible';
    el.next.textContent = step === GROUPS.length - 1 ? 'See my scorecard' : 'Continue';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  el.qs.addEventListener('click', function (e) {
    var b = e.target.closest('.opt'); if (!b) return;
    answers[b.closest('.q').getAttribute('data-d')] = Number(b.getAttribute('data-v'));
    Array.prototype.forEach.call(b.parentNode.children, function (c) { c.classList.remove('on'); });
    b.classList.add('on');
    el.answered.textContent = countAnswered() + ' of ' + T.domains.length + ' answered';
    el.trackFill.style.width = (countAnswered() / T.domains.length * 100) + '%';
  });

  el.back.addEventListener('click', function () { if (step > 0) { step--; render(); } });
  el.next.addEventListener('click', function () {
    var missing = groupDomains(step).filter(function (d) { return answers[d.slug] === undefined; });
    if (missing.length) {
      el.answered.innerHTML = '<span style="color:var(--warn)">' + missing.length + ' unanswered</span>';
      var first = el.qs.querySelector('.q[data-d="' + missing[0].slug + '"]');
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (step < GROUPS.length - 1) { step++; render(); } else finish();
  });

  function finish() {
    T.saveScores({ answers: answers, at: Date.now() });

    var scored = T.domains.map(function (d) {
      var v = answers[d.slug] || 0;
      return { d: d, v: v, pct: Math.round(v / 2 * 100) };
    });
    var pct = Math.round(scored.reduce(function (a, s) { return a + s.v; }, 0) / (T.domains.length * 2) * 100);

    var band = pct >= 80 ? ['Enterprise-ready', 'Past the structural blockers. What is left is depth.']
             : pct >= 55 ? ['Deal-capable, with gaps', 'You can win these deals, but a few of these surface in every security review.']
             : pct >= 30 ? ['Upmarket in progress', 'A product that works for teams, meeting buyers who expect a platform.']
             : ['Early', 'Most of this is ahead of you — cheaper to sequence deliberately than to build under a deadline.'];

    var gaps = {};
    scored.forEach(function (s) { if (s.v < 2) gaps[s.d.slug] = 2 - s.v; });
    var ranked = T.rank(gaps).slice(0, 3);
    var top3 = scored.slice().sort(function (a, b) { return a.v - b.v; })
      .filter(function (s) { return s.v < 2; }).slice(0, 3);

    var C = 2 * Math.PI * 52, dash = C * pct / 100;

    el.results.innerHTML =
      '<div class="score">' +
        '<div class="dial"><svg width="120" height="120">' +
          '<circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="8"/>' +
          '<circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="8" ' +
            'stroke-linecap="round" stroke-dasharray="' + dash + ' ' + (C - dash) + '"/></svg>' +
          '<div class="val"><b>' + pct + '</b></div></div>' +
        '<div><span class="eyebrow">Your result</span>' +
          '<h1 class="h1" style="margin:8px 0 8px">' + band[0] + '</h1>' +
          '<p class="body">' + band[1] + '</p></div>' +
      '</div>' +

      (top3.length ?
        '<h2 class="h3" style="margin:44px 0 4px">Start here</h2>' +
        '<p class="small muted" style="margin-bottom:10px">Your widest gaps, in order.</p>' +
        '<div class="rows">' + top3.map(function (s) {
          return '<a href="domain.html?d=' + s.d.slug + '"><div class="row-split">' +
            '<div><div class="rt">' + T.esc(s.d.name) + '</div>' +
            '<div class="rd">' + T.esc(s.d.signals[0]) + '</div></div>' +
            '<span class="rmeta">' + (s.v === 0 ? 'gap' : 'partial') + '</span></div></a>';
        }).join('') + '</div>' : '') +

      '<details style="margin-top:14px"><summary>All eighteen areas</summary><div>' +
        GROUPS.map(function (g) {
          var rows = scored.filter(function (s) { return s.d.group === g.name; })
            .sort(function (a, b) { return a.v - b.v; }).map(function (s) {
              return '<div class="bar-row lvl-' + s.v + '">' +
                '<a href="domain.html?d=' + s.d.slug + '">' + T.esc(s.d.name) + '</a>' +
                '<div class="bar"><i style="width:' + Math.max(s.pct, 4) + '%"></i></div>' +
                '<span class="n">' + ['gap', 'partial', 'solid'][s.v] + '</span></div>';
            }).join('');
          return '<div style="margin-top:18px"><span class="eyebrow">' + T.esc(g.name) + '</span>' + rows + '</div>';
        }).join('') +
      '</div></details>' +

      (ranked.length ?
        '<h2 class="h3" style="margin:44px 0 10px">Who works on this</h2>' +
        ranked.map(function (r) { return T.person(r.expert, { lead: r.hits[0] }); }).join('') : '') +

      '<div class="spread" style="margin-top:40px;align-items:center">' +
        '<a class="btn btn-accent" href="brief.html?from=scorecard">Turn this into a brief</a>' +
        '<button class="link small" id="redo" style="background:none;border:0;cursor:pointer">Retake</button>' +
      '</div>';

    el.quiz.classList.add('hide');
    el.intro.classList.add('hide');
    el.results.classList.remove('hide');
    window.scrollTo({ top: 0, behavior: 'smooth' });

    document.getElementById('redo').addEventListener('click', function () {
      answers = {}; step = 0;
      T.saveScores({ answers: {}, at: Date.now() });
      el.results.classList.add('hide');
      el.quiz.classList.remove('hide');
      el.intro.classList.remove('hide');
      render();
    });
  }

  if (countAnswered() === T.domains.length) finish(); else render();
})();
</script>
</body>
</html>

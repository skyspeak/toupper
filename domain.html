<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice area — ToUpper</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="site-header"></div>
<main id="main"></main>
<div id="site-footer"></div>

<script src="data/domains.js"></script>
<script src="data/experts.js"></script>
<script src="assets/js/core.js"></script>
<script>
(function () {
  var d = T.domain(T.param('d'));
  var main = document.getElementById('main');

  if (!d) {
    main.innerHTML = '<section class="section"><div class="wrap-narrow empty">' +
      '<h1 class="h2">No such practice area</h1>' +
      '<p class="body" style="margin:12px 0 20px">That link does not match anything on the map.</p>' +
      '<a class="btn" href="domains.html">Back to the readiness map</a></div></section>';
    return;
  }

  document.title = d.name + ' — ToUpper';
  var xs = T.expertsFor(d.slug);
  var group = window.TOUPPER_GROUPS.filter(function (g) { return g.name === d.group; })[0] || {};

  var li = function (a) { return a.map(function (t) { return '<li>' + T.esc(t) + '</li>'; }).join(''); };

  main.innerHTML =
  '<section style="padding:44px 0 8px"><div class="wrap">' +
    '<div class="row small muted" style="gap:8px;margin-bottom:20px">' +
      '<a href="domains.html" style="text-decoration:none">Readiness map</a><span>/</span>' +
      '<span>' + T.esc(d.group) + '</span>' +
    '</div>' +
    '<div class="split">' +
      '<div>' +
        '<span class="eyebrow">' + T.esc(d.group) + ' — ' + T.esc(group.tag || '') + '</span>' +
        '<h1 class="h1" style="margin:14px 0 18px">' + T.esc(d.name) + '</h1>' +
        '<p class="lede">' + T.esc(d.blurb) + '</p>' +
      '</div>' +
      '<div class="card">' +
        '<span class="eyebrow">On this bench</span>' +
        '<div class="h1" style="font-family:var(--mono);margin:10px 0 4px">' + xs.length + '</div>' +
        '<p class="small muted" style="margin-bottom:16px">independent operators list this as a practice area</p>' +
        '<a class="btn btn-accent" style="width:100%" href="directory.html?d=' + d.slug + '">See them</a>' +
        '<a class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" href="brief.html?d=' + d.slug + '">Post a brief in this area</a>' +
      '</div>' +
    '</div>' +
  '</div></section>' +

  '<section class="section-sm"><div class="wrap grid g2" style="gap:16px;align-items:stretch">' +
    '<div class="card" style="padding:28px">' +
      '<span class="eyebrow">What good looks like</span>' +
      '<ul class="checklist" style="margin-top:16px">' + li(d.good) + '</ul>' +
    '</div>' +
    '<div class="card" style="padding:28px">' +
      '<span class="eyebrow">Signals you need help</span>' +
      '<ul class="signals" style="margin-top:16px">' + li(d.signals) + '</ul>' +
      '<div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)">' +
        '<span class="eyebrow">Typical engagements</span>' +
        '<div class="pills" style="margin-top:12px">' +
          d.engagements.map(function (e) { return '<span class="pill">' + T.esc(e) + '</span>'; }).join('') +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div></section>' +

  '<section class="section-sm"><div class="wrap">' +
    '<div class="section-head"><span class="eyebrow">The bench</span>' +
      '<h2 class="h2" style="margin-top:12px">Experts in ' + T.esc(d.name.toLowerCase()) + '</h2></div>' +
    '<div class="grid g3">' + xs.map(function (x) {
        return T.expertCard(x, { highlight: [d.slug] });
      }).join('') + '</div>' +
  '</div></section>' +

  '<section class="section-sm"><div class="wrap">' +
    '<hr class="rule" style="margin-bottom:26px">' +
    '<span class="eyebrow">Usually comes with</span>' +
    '<div class="map-items" style="margin-top:16px">' + d.related.map(function (r) {
      var rd = T.domain(r);
      return '<a class="map-item" href="domain.html?d=' + rd.slug + '"><b>' + T.esc(rd.name) +
        '</b><span>' + T.esc(rd.short) + '</span></a>';
    }).join('') + '</div>' +
  '</div></section>';
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice area — ToUpper</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="site-header"></div>
<main id="main"></main>
<div id="site-footer"></div>

<script src="data/domains.js"></script>
<script src="data/experts.js"></script>
<script src="assets/js/core.js"></script>
<script>
(function () {
  var d = T.domain(T.param('d'));
  var main = document.getElementById('main');

  if (!d) {
    main.innerHTML = '<section class="section"><div class="narrow">' +
      '<h1 class="h1">No such practice area</h1>' +
      '<p class="body" style="margin:14px 0 22px">That link does not match anything.</p>' +
      '<a class="btn" href="domains.html">All practice areas</a></div></section>';
    return;
  }

  document.title = d.name + ' — ToUpper';
  var xs = T.expertsFor(d.slug);
  var li = function (a) { return a.map(function (t) { return '<li>' + T.esc(t) + '</li>'; }).join(''); };

  main.innerHTML =
  '<section class="section"><div class="wrap">' +
    '<div class="grid split" style="grid-template-columns:1.35fr .65fr;gap:56px;align-items:start">' +
      '<div>' +
        '<span class="eyebrow">' + T.esc(d.group) + '</span>' +
        '<h1 class="h1" style="margin:12px 0 18px">' + T.esc(d.name) + '</h1>' +
        '<p class="lede">' + T.esc(d.blurb) + '</p>' +

        '<h2 class="h3" style="margin:40px 0 12px">What good looks like</h2>' +
        '<ul class="list">' + li(d.good) + '</ul>' +

        '<h2 class="h3" style="margin:32px 0 12px">Signals you need help</h2>' +
        '<ul class="list">' + li(d.signals) + '</ul>' +

        '<h2 class="h3" style="margin:32px 0 12px">Typical engagements</h2>' +
        '<ul class="list">' + li(d.engagements) + '</ul>' +
      '</div>' +

      '<div>' +
        '<div class="card">' +
          '<span class="eyebrow">On this bench</span>' +
          '<div class="h1 mono" style="margin:8px 0 6px">' + xs.length + '</div>' +
          '<p class="small muted" style="margin-bottom:18px">independent operators work in this area</p>' +
          '<a class="btn btn-accent btn-sm" style="width:100%" href="directory.html?d=' + d.slug + '">See them</a>' +
        '</div>' +
        '<div style="margin-top:26px">' +
          '<span class="eyebrow">Usually comes with</span>' +
          '<div class="rows" style="margin-top:8px">' + d.related.map(function (r) {
            var rd = T.domain(r);
            return '<a href="domain.html?d=' + rd.slug + '"><div class="rt" style="font-size:14.5px">' +
              T.esc(rd.name) + '</div></a>';
          }).join('') + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div></section>' +

  '<section class="section-sm"><div class="wrap">' +
    '<span class="eyebrow">Experts</span>' +
    '<div style="margin-top:14px">' + xs.map(function (x) {
        return T.person(x, { lead: d.slug });
      }).join('') + '</div>' +
  '</div></section>';
})();
</script>
</body>
</html>

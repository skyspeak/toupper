<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expert — ToUpper</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="site-header"></div>
<main id="main"></main>
<div id="site-footer"></div>

<script src="data/domains.js"></script>
<script src="data/experts.js"></script>
<script src="assets/js/core.js"></script>
<script>
(function () {
  var x = T.expert(T.param('id'));
  var main = document.getElementById('main');

  if (!x) {
    main.innerHTML = '<section class="section"><div class="narrow">' +
      '<h1 class="h1">Profile not found</h1>' +
      '<p class="body" style="margin:14px 0 22px">That profile link does not resolve.</p>' +
      '<a class="btn" href="directory.html">All experts</a></div></section>';
    return;
  }

  document.title = x.name + ' — ToUpper';
  var saved = T.shortlist().indexOf(x.id) > -1;

  main.innerHTML =
  '<section class="section"><div class="wrap">' +
    '<div class="grid split" style="grid-template-columns:1.35fr .65fr;gap:56px;align-items:start">' +
      '<div>' +
        '<div class="row" style="align-items:flex-start;gap:16px;margin-bottom:22px">' + T.avatar(x, true) +
          '<div><h1 class="h1">' + T.esc(x.name) + '</h1>' +
          '<p class="lede muted" style="margin-top:4px">' + T.esc(x.headline) + '</p></div>' +
        '</div>' +
        '<p class="quote" style="margin-bottom:24px">“' + T.esc(x.quote) + '”</p>' +
        '<div class="prose" style="max-width:62ch"><p>' + T.esc(x.bio) + '</p></div>' +

        '<h2 class="h3" style="margin:36px 0 12px">Track record</h2>' +
        '<ul class="list" style="max-width:66ch">' +
          x.proof.map(function (p) { return '<li>' + T.esc(p) + '</li>'; }).join('') +
        '</ul>' +
        '<p class="tiny muted" style="margin-top:14px">Sample data — names and outcomes are illustrative.</p>' +

        '<h2 class="h3" style="margin:36px 0 10px">Practice areas</h2>' +
        '<div class="rows">' + x.domains.map(function (s) {
          var d = T.domain(s);
          return '<a href="domain.html?d=' + d.slug + '"><div class="row-split">' +
            '<div class="rt" style="font-size:15px">' + T.esc(d.name) + '</div>' +
            '<span class="rmeta">' + T.expertsFor(d.slug).length + ' experts</span></div></a>';
        }).join('') + '</div>' +
      '</div>' +

      '<div class="card">' +
        '<dl class="kv" style="margin-bottom:20px">' +
          '<dt>Available</dt><dd>' + T.esc(x.avail) + '</dd>' +
          '<dt>Focus</dt><dd>' + T.esc(x.focus) + '</dd>' +
          '<dt>Based</dt><dd>' + T.esc(x.location) + '</dd>' +
          '<dt>Experience</dt><dd>' + x.years + ' years</dd>' +
          '<dt>Works as</dt><dd>' + x.modes.join(', ') + '</dd>' +
          '<dt>Rate</dt><dd>' + T.esc(T.rateRange(x.rate)) + '</dd>' +
        '</dl>' +
        '<a class="btn btn-accent btn-sm" style="width:100%" href="brief.html?expert=' + encodeURIComponent(x.id) + '">Request an intro</a>' +
        '<button class="btn btn-ghost btn-sm" id="save" style="width:100%;margin-top:8px">' +
          (saved ? 'Saved ✓' : 'Save for later') + '</button>' +
      '</div>' +
    '</div>' +
  '</div></section>';

  document.getElementById('save').addEventListener('click', function () {
    this.textContent = T.toggleShortlist(x.id) ? 'Saved ✓' : 'Save for later';
  });
})();
</script>
</body>
</html>

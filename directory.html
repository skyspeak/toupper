<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Experts — ToUpper</title>
<meta name="description" content="Independent enterprise-readiness experts, filterable by practice area and availability.">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="wrap">
    <div class="head">
      <span class="eyebrow">The bench</span>
      <h1 class="h1">Experts</h1>
      <p class="body">Everyone here shipped this work inside a company before selling it as a service.</p>
    </div>

    <div class="dir">
      <aside class="filters">
        <div class="grp">
          <h4>Practice area</h4>
          <div id="fDomains"></div>
        </div>
        <div class="grp">
          <label class="check"><input type="checkbox" id="fOpen"><span>Available now</span></label>
          <button class="link small" id="clear" style="margin-top:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left">Clear filters</button>
        </div>
      </aside>

      <div>
        <input class="search" id="q" type="search" placeholder="Search — try “SCIM” or “invoice”" aria-label="Search experts">
        <div class="spread" style="margin:20px 0 4px">
          <span class="small muted" id="count"></span>
          <select class="search" id="sort" style="width:auto;height:34px;font-size:14px;padding:0 8px">
            <option value="relevance">Best match</option>
            <option value="years">Most experience</option>
            <option value="avail">Available soonest</option>
          </select>
        </div>
        <div id="results"></div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="data/domains.js"></script>
<script src="data/experts.js"></script>
<script src="assets/js/core.js"></script>
<script>
(function () {
  var state = { domains: [], open: false, q: '', sort: 'relevance' };
  var pre = T.param('d');
  if (pre && T.domain(pre)) state.domains.push(pre);

  document.getElementById('fDomains').innerHTML = window.TOUPPER_GROUPS.map(function (g) {
    var rows = T.domains.filter(function (d) { return d.group === g.name; }).map(function (d) {
      return '<label class="check"><input type="checkbox" value="' + d.slug + '"' +
        (state.domains.indexOf(d.slug) > -1 ? ' checked' : '') + '><span>' + T.esc(d.name) + '</span></label>';
    }).join('');
    return '<div style="margin-bottom:16px"><div class="tiny muted mono" style="margin-bottom:3px">' +
      T.esc(g.name) + '</div>' + rows + '</div>';
  }).join('');

  function haystack(x) {
    return [x.name, x.headline, x.focus, x.bio, x.quote, x.location, x.modes.join(' '),
            x.proof.join(' '), x.domains.map(T.domainName).join(' ')].join(' ').toLowerCase();
  }
  function availRank(a) { return /available now/i.test(a) ? 0 : /booked/i.test(a) ? 2 : 1; }

  function apply() {
    var q = state.q.trim().toLowerCase();
    var list = T.experts.filter(function (x) {
      if (state.domains.length && !state.domains.some(function (d) { return x.domains.indexOf(d) > -1; })) return false;
      if (state.open && !/available now/i.test(x.avail)) return false;
      if (q && haystack(x).indexOf(q) === -1) return false;
      return true;
    });

    var s = state.sort;
    list.sort(function (a, b) {
      if (s === 'years') return b.years - a.years;
      if (s === 'avail') return availRank(a.avail) - availRank(b.avail) || b.years - a.years;
      var oa = state.domains.filter(function (d) { return a.domains.indexOf(d) > -1; }).length;
      var ob = state.domains.filter(function (d) { return b.domains.indexOf(d) > -1; }).length;
      return ob - oa || availRank(a.avail) - availRank(b.avail) || b.engagements - a.engagements;
    });

    document.getElementById('count').textContent = list.length + (list.length === 1 ? ' expert' : ' experts');
    document.getElementById('results').innerHTML = list.length
      ? list.map(function (x) { return T.person(x, { lead: state.domains[0] }); }).join('')
      : '<div class="empty">Nobody matches that combination. Loosen a filter, or ' +
        '<a class="link" href="brief.html">post a brief</a> and we will go looking.</div>';
  }

  document.getElementById('fDomains').addEventListener('change', function (e) {
    var v = e.target.value, i = state.domains.indexOf(v);
    if (e.target.checked && i === -1) state.domains.push(v);
    if (!e.target.checked && i > -1) state.domains.splice(i, 1);
    apply();
  });
  document.getElementById('fOpen').addEventListener('change', function (e) { state.open = e.target.checked; apply(); });
  document.getElementById('sort').addEventListener('change', function (e) { state.sort = e.target.value; apply(); });
  document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value; apply(); });
  document.getElementById('clear').addEventListener('click', function () {
    state.domains = []; state.open = false; state.q = '';
    Array.prototype.forEach.call(document.querySelectorAll('.filters input[type=checkbox]'), function (c) { c.checked = false; });
    document.getElementById('q').value = '';
    apply();
  });

  apply();
})();
</script>
</body>
</html>

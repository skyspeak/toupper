<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice areas — ToUpper</title>
<meta name="description" content="The eighteen practice areas that make up enterprise readiness, from single sign-on and provisioning to billing, compliance and deployment.">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="wrap">
    <div class="head">
      <span class="eyebrow">Practice areas</span>
      <h1 class="h1">Everything that breaks when you sell to a large company</h1>
      <p class="body">Eighteen areas in five groups, adapted from the twelve chapters of <a class="link" href="https://www.enterpriseready.io/" rel="noopener">enterpriseready.io</a> and split further where real specialists exist. Most companies are blocked by four or five — <a class="link" href="assessment.html">the scorecard</a> tells you which.</p>
    </div>
    <div id="groups"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="data/domains.js"></script>
<script src="data/experts.js"></script>
<script src="assets/js/core.js"></script>
<script>
document.getElementById('groups').innerHTML = window.TOUPPER_GROUPS.map(function (g) {
  var ds = T.domains.filter(function (d) { return d.group === g.name; });
  return '<div style="margin-bottom:40px">' +
    '<div class="spread" style="margin-bottom:6px">' +
      '<span class="eyebrow">' + T.esc(g.name) + '</span>' +
      '<span class="tiny muted">' + T.esc(g.tag) + '</span>' +
    '</div>' +
    '<div class="rows">' + ds.map(function (d) {
      var n = T.expertsFor(d.slug).length;
      return '<a href="domain.html?d=' + d.slug + '"><div class="row-split">' +
        '<div><div class="rt">' + T.esc(d.name) + '</div><div class="rd">' + T.esc(d.short) + '</div></div>' +
        '<span class="rmeta">' + n + ' expert' + (n === 1 ? '' : 's') + '</span>' +
      '</div></a>';
    }).join('') + '</div></div>';
}).join('');
</script>
</body>
</html>
